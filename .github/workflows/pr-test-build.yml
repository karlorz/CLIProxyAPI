name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  skip-bot-release-pr:
    if: github.head_ref == 'bot/release-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Skip required PR CI for bot/release-pr
        run: echo 'bot/release-pr is covered by release-pr.yml; skipping pr-test-build'

  build:
    if: github.head_ref != 'bot/release-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
